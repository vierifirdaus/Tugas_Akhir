<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Aplikasi Visualisasi Graf - Multi-Graf</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f0f4f8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #a0aec0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #718096; }
        .placeholder-graph {
            background-color: #e2e8f0;
            background-image: repeating-linear-gradient(45deg, #cbd5e0 25%, transparent 25%, transparent 75%, #cbd5e0 75%, #cbd5e0), repeating-linear-gradient(45deg, #cbd5e0 25%, transparent 25%, transparent 75%, #cbd5e0 75%, #cbd5e0);
            background-position: 0 0, 5px 5px;
            background-size: 10px 10px;
            border: 2px dashed #a0aec0;
        }
        .btn-primary { background-color: #4f46e5; }
        .btn-primary:hover { background-color: #4338ca; }
        .btn-secondary { background-color: #10b981; }
        .btn-secondary:hover { background-color: #059669; }
        .btn-tertiary { background-color: #6b7280; }
        .btn-tertiary:hover { background-color: #4b5563; }
        .checkbox-custom {
            accent-color: #4f46e5; /* Warna centang indigo */
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex flex-col md:flex-row h-screen">
        <div class="w-full md:w-1/3 bg-white p-6 shadow-xl flex flex-col space-y-4 overflow-y-auto">
            <h2 class="text-2xl font-semibold text-gray-800 mb-2">Input Kode & Kontrol</h2>

            <div>
                <label for="codeInput" class="block text-sm font-medium text-gray-700 mb-1">Kode Program Python:</label>
                <textarea id="codeInput" name="codeInput" rows="10" class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm resize-none" placeholder="Masukkan atau tempel kode Python Anda di sini..."></textarea>
            </div>

            <div>
                <label for="fileUpload" class="block text-sm font-medium text-gray-700 mb-1">Atau Unggah Berkas (.py):</label>
                <input type="file" id="fileUpload" name="fileUpload" accept=".py" class="w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-200 cursor-pointer transition duration-150 ease-in-out">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Pilih Jenis Graf (bisa lebih dari satu):</label>
                <div class="space-y-2">
                    <div class="flex items-center">
                        <input id="cfgCheckbox" name="graphTypes" type="checkbox" value="CFG" class="checkbox-custom h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="cfgCheckbox" class="ml-2 block text-sm text-gray-900">Control Flow Graph (CFG)</label>
                    </div>
                    <div class="flex items-center">
                        <input id="cgCheckbox" name="graphTypes" type="checkbox" value="Call Graph" class="checkbox-custom h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="cgCheckbox" class="ml-2 block text-sm text-gray-900">Call Graph (CG)</label>
                    </div>
                    <div class="flex items-center">
                        <input id="pdgCheckbox" name="graphTypes" type="checkbox" value="Program Dependency Graph" class="checkbox-custom h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <label for="pdgCheckbox" class="ml-2 block text-sm text-gray-900">Program Dependency Graph (PDG)</label>
                    </div>
                </div>
            </div>
            
            <div id="cfgSpecificControlsContainer" class="hidden mt-2">
                 <label for="functionSelect" class="block text-sm font-medium text-gray-700 mb-1">Detail CFG (Pilih Fungsi/Metode):</label>
                 <select id="functionSelect" name="functionSelect" class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                    <option value="main">Kode Utama</option>
                    <option value="fungsi_contoh_1">fungsi_contoh_1()</option>
                    <option value="metode_kelas_a">KelasA.metode_a()</option>
                 </select>
            </div>

            <button id="visualizeButton" class="w-full btn-primary text-white font-semibold py-3 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition duration-150 ease-in-out mt-2">
                <i class="fas fa-project-diagram mr-2"></i>Visualisasikan
            </button>

             <button id="saveCodeButton" class="w-full btn-tertiary text-white font-semibold py-2 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 transition duration-150 ease-in-out text-sm">
                <i class="fas fa-save mr-2"></i>Simpan Kode
            </button>

            <div id="feedbackMessage" class="text-sm p-3 rounded-lg hidden mt-auto">
                </div>
        </div>

        <div class="w-full md:w-2/3 bg-gray-50 p-6 flex flex-col">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4">
                <h2 class="text-2xl font-semibold text-gray-800 mb-2 sm:mb-0">Visualisasi Graf Gabungan</h2>
                <div class="flex space-x-2">
                    <button id="downloadSVGButton" class="btn-secondary text-white font-semibold py-2 px-3 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 transition duration-150 ease-in-out text-sm">
                        <i class="fas fa-download mr-1"></i> Unduh SVG
                    </button>
                     <button id="downloadPNGButton" class="btn-secondary text-white font-semibold py-2 px-3 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 transition duration-150 ease-in-out text-sm">
                        <i class="fas fa-image mr-1"></i> Unduh PNG
                    </button>
                </div>
            </div>
            
            <div id="activeGraphsInfo" class="mb-4 p-3 bg-indigo-50 text-indigo-700 rounded-lg text-sm hidden">
                </div>

            <div id="graphCanvas" class="flex-grow bg-white border border-gray-300 rounded-lg shadow-inner placeholder-graph flex items-center justify-center p-4">
                <p class="text-gray-500 text-lg text-center">Area Visualisasi Graf Gabungan (React Xyflow)<br><span class="text-sm">Centang jenis graf dan klik "Visualisasikan".</span></p>
            </div>
            
            <div class="mt-4 flex justify-center space-x-2">
                <button class="p-2 bg-gray-300 hover:bg-gray-400 rounded-md text-gray-700 text-xs shadow"><i class="fas fa-search-plus"></i></button>
                <button class="p-2 bg-gray-300 hover:bg-gray-400 rounded-md text-gray-700 text-xs shadow"><i class="fas fa-search-minus"></i></button>
                <button class="p-2 bg-gray-300 hover:bg-gray-400 rounded-md text-gray-700 text-xs shadow"><i class="fas fa-expand-arrows-alt"></i> Reset</button>
            </div>
        </div>
    </div>

    <script>
        const cfgCheckbox = document.getElementById('cfgCheckbox');
        const cfgSpecificControlsContainer = document.getElementById('cfgSpecificControlsContainer');
        const visualizeButton = document.getElementById('visualizeButton');
        const saveCodeButton = document.getElementById('saveCodeButton');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const codeInput = document.getElementById('codeInput');
        const fileUpload = document.getElementById('fileUpload');
        const graphCanvas = document.getElementById('graphCanvas');
        const activeGraphsInfo = document.getElementById('activeGraphsInfo');
        const graphCheckboxes = document.querySelectorAll('input[name="graphTypes"]');

        function displayMessage(message, type = 'info') {
            feedbackMessage.classList.remove('hidden');
            feedbackMessage.textContent = message;
            feedbackMessage.className = 'text-sm p-3 rounded-lg mt-auto '; // Reset classes
            if (type === 'error') feedbackMessage.classList.add('bg-red-100', 'text-red-700');
            else if (type === 'success') feedbackMessage.classList.add('bg-green-100', 'text-green-700');
            else if (type === 'info') feedbackMessage.classList.add('bg-blue-100', 'text-blue-700');
            else feedbackMessage.classList.add('bg-yellow-100', 'text-yellow-700');
        }

        cfgCheckbox.addEventListener('change', function() {
            if (this.checked) {
                cfgSpecificControlsContainer.classList.remove('hidden');
            } else {
                cfgSpecificControlsContainer.classList.add('hidden');
            }
        });

        visualizeButton.addEventListener('click', function() {
            if (!codeInput.value && !fileUpload.value) {
                 displayMessage('Harap masukkan kode atau unggah berkas terlebih dahulu.', 'error');
                 return;
            }

            const selectedGraphs = [];
            graphCheckboxes.forEach(checkbox => {
                if (checkbox.checked) {
                    selectedGraphs.push(checkbox.value);
                }
            });

            if (selectedGraphs.length === 0) {
                displayMessage('Harap pilih minimal satu jenis graf untuk divisualisasikan.', 'error');
                return;
            }
            
            const selectedGraphText = selectedGraphs.join(' + ');
            displayMessage(`Menganalisis kode dan menghasilkan ${selectedGraphText}...`, 'info');
            activeGraphsInfo.textContent = `Menampilkan: ${selectedGraphText}`;
            activeGraphsInfo.classList.remove('hidden');

            setTimeout(() => {
                displayMessage(`${selectedGraphText} berhasil divisualisasikan!`, 'success');
                graphCanvas.innerHTML = `<p class="text-green-600 text-xl font-semibold text-center">Visualisasi Gabungan untuk:<br>${selectedGraphs.map(g => `<span>${g}</span>`).join('<br>')}<br>Ditampilkan di Sini!</p>`;
                graphCanvas.classList.remove('placeholder-graph');
            }, 2000);
        });

        saveCodeButton.addEventListener('click', () => {
            if (!codeInput.value) {
                displayMessage('Tidak ada kode untuk disimpan.', 'warning');
                return;
            }
            displayMessage('Kode berhasil disimpan (simulasi).', 'success');
        });
        
        document.getElementById('downloadSVGButton').addEventListener('click', () => {
            displayMessage('Fungsi unduh SVG belum diimplementasikan.', 'warning');
        });
        document.getElementById('downloadPNGButton').addEventListener('click', () => {
            displayMessage('Fungsi unduh PNG belum diimplementasikan.', 'warning');
        });

    </script>
</body>
</html>
