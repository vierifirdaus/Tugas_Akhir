# docker-compose.yml

version: '3.8'

services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - ./npm-data/data:/data
      - ./npm-data/letsencrypt:/etc/letsencrypt
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: visualisasi-backend
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: visualisasi-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.vierifirdaus.site
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge